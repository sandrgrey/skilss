[project]
name = "sandr-dev-stack"
version = "0.1.0"
description = "Local AI development stack: skills, project memory, loop guard, safe transactions, and MCP access."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandr" }]
dependencies = [
  "mcp>=1.23,<2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
sandr = "sandr.cli:main"
sandr-mcp = "sandr.mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
